name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  # Must match typst.toml's `package.name`; tarball, branch and PR
  # names all derive from it.
  PACKAGE_NAME: gairm-import
  TYPST_VERSION: v0.15.0
  # Formatter output can shift between versions: bump deliberately and
  # reformat in the same commit.
  TYPSTYLE_VERSION: v0.15.0

# An explicit `bash` adds `-o pipefail`, so a failure on the left of a
# pipe (`curl | tar`, `gh pr create | tail`) fails the step.
defaults:
  run:
    shell: bash

jobs:
  # `make test`: every fixture, panic case and package test.
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Cached per version: saves a download, and a 504 on it.
      - name: Restore Typst
        id: typst-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.local/bin/typst
          key: typst-${{ env.TYPST_VERSION }}

      - name: Install Typst
        if: steps.typst-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/.local/bin
          curl -sSfL "https://github.com/typst/typst/releases/download/${TYPST_VERSION}/typst-x86_64-unknown-linux-musl.tar.xz" \
            | tar -xJ --strip-components=1 -C ~/.local/bin typst-x86_64-unknown-linux-musl/typst

      - name: Put the cached tools on PATH
        run: echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # `-k`: report every failure. `-j4 -O`: four cores, each check's
      # log kept together.
      - name: Compile fixtures, check panic cases and package tests
        run: make -k -j4 -O test

      - name: Check layering
        run: make check-layers

  # typstyle parses source only, so no Typst needed. The flags live in
  # the Makefile, so this job and `make fmt` agree.
  format:
    name: typstyle
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Restore typstyle
        id: typstyle-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.local/bin/typstyle
          key: typstyle-${{ env.TYPSTYLE_VERSION }}

      - name: Install typstyle
        if: steps.typstyle-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/.local/bin
          curl -sSfL -o ~/.local/bin/typstyle \
            "https://github.com/typstyle-rs/typstyle/releases/download/${TYPSTYLE_VERSION}/typstyle-x86_64-unknown-linux-musl"
          chmod +x ~/.local/bin/typstyle

      - name: Put the cached tools on PATH
        run: echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Check formatting
        run: make fmt-check

  # Runs the same checker as typst/packages' CI before a release is
  # cut: catches tarball-list drift, README-link rot and deprecated APIs.
  package-check:
    name: typst-package-check
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    env:
      # Pinned so a checker update can't flip the verdict on the same source.
      PCHECK_IMAGE: ghcr.io/typst/package-check:0.6.0
      # Stamped into the staged manifest so the directory matches what
      # @preview/<name>:<version> resolves to.
      PKG_VERSION: 0.0.0
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Stage package directory matching the release tarball
        run: make stage-package-dir PKG_DIR="/tmp/pkg-check/packages/preview/${PACKAGE_NAME}/${PKG_VERSION}" PKG_VERSION="${PKG_VERSION}"

      # The tool must run from the `packages` subdir.
      - name: Validate package
        run: |
          docker run --rm \
            -v /tmp/pkg-check:/data \
            --workdir /data/packages \
            ${PCHECK_IMAGE} \
            check @preview/${PACKAGE_NAME}:${PKG_VERSION}

  # release-please-config.json bumps typst.toml's `package.version`
  # as an extra-file, keeping it in lockstep with the tag.
  release-please:
    needs: [test, format]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      tag_name: ${{ steps.rp.outputs.tag_name }}
      version: ${{ steps.rp.outputs.version }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: rp
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # A library, not a template: no template/ or thumbnail to ship.
  attach-release-artifacts:
    needs: [release-please]
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.release-please.outputs.tag_name }}

      # File list: the Makefile's PACKAGE_FILES, shared with the PR-time
      # package-check job. A README link to a file not listed there
      # will 404 on Universe.
      - name: Build package tarball
        env:
          VERSION: ${{ needs.release-please.outputs.version }}
        run: make package-tarball PACKAGE_TARBALL="${PACKAGE_NAME}-${VERSION}.tar.gz"

      - name: Attach tarball to release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          tag_name: ${{ needs.release-please.outputs.tag_name }}
          files: |
            ${{ env.PACKAGE_NAME }}-*.tar.gz
          make_latest: 'true'

  # When release-please cuts a new tag, automatically open a PR on
  # typst/packages submitting gairm-import:<version> to Typst Universe.
  # The PR is created from a maintainer-owned fork (smur89/packages),
  # branched off the current typst/packages main so the diff is just
  # the new package directory.
  #
  # NOTE: this workflow only handles version *updates*. The very first
  # submission of gairm-import to typst/packages must be opened manually
  # so the maintainers can do a full new-package review. See
  # CONTRIBUTING.md.
  #
  # Prerequisites (one-time setup):
  #   1. Fork github.com/typst/packages to smur89/packages.
  #   2. Create a classic PAT at github.com/settings/tokens with scopes:
  #        - repo        (push the branch + open the cross-repo PR)
  #        - workflow    (the branch is created off upstream/main, so it
  #                       may carry .github/workflows/* updates the fork
  #                       doesn't have yet — without `workflow` scope the
  #                       push is rejected by GitHub).
  #      Fine-grained PATs don't work here: they can only grant
  #      permissions on repos you own, but `gh pr create` against
  #      typst/packages (which we don't own) needs PR-write on that
  #      upstream repo. Classic PATs sidestep this by acting as the
  #      authenticated user, who has the standard public-repo
  #      PR-opening capability.
  #   3. Store the PAT as a repository secret named TYPST_UNIVERSE_TOKEN
  #      on smur89/gairm-import.
  #
  # The job is idempotent: re-running for an already-submitted version
  # detects the existing PR, captures its URL, and skips creation.
  # Older `gairm-import:*` PRs we own are then auto-closed with a
  # supersede comment pointing at the current submission.
  submit-to-typst-universe:
    needs: [release-please, attach-release-artifacts]
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    env:
      VERSION: ${{ needs.release-please.outputs.version }}
      TAG: ${{ needs.release-please.outputs.tag_name }}
      FORK_REPO: smur89/packages
      UPSTREAM_REPO: typst/packages
      GH_TOKEN: ${{ secrets.TYPST_UNIVERSE_TOKEN }}
    steps:
      - name: Skip if a PR for this version is already open
        id: check
        run: |
          existing=$(gh pr list \
            --repo "$UPSTREAM_REPO" \
            --head "${FORK_REPO%%/*}:${PACKAGE_NAME}-${VERSION}" \
            --state open \
            --json url --jq '.[0].url // empty')
          if [ -n "$existing" ]; then
            echo "PR already open: $existing — skipping submission"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "pr_url=$existing" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout PR body template
        if: steps.check.outputs.skip != 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/typst-universe-pr-body.md
          sparse-checkout-cone-mode: false

      - name: Configure git
        if: steps.check.outputs.skip != 'true'
        run: |
          gh auth setup-git
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      # Blobless + sparse: the fork mirrors all of typst/packages, and
      # we only touch our own directory. Plain `git clone`, because
      # `gh repo clone` fetches upstream without the filter.
      - name: Clone fork (sparse, blobless) and branch off upstream/main
        if: steps.check.outputs.skip != 'true'
        run: |
          git clone --no-tags --depth=1 --filter=blob:none --sparse \
            "https://github.com/${FORK_REPO}.git" pkg
          cd pkg
          git sparse-checkout set "packages/preview/${PACKAGE_NAME}"
          git remote add upstream "https://github.com/${UPSTREAM_REPO}.git"
          git fetch --depth=1 --filter=blob:none upstream main
          git checkout -b "${PACKAGE_NAME}-${VERSION}" upstream/main

      - name: Add package files from the release tarball
        if: steps.check.outputs.skip != 'true'
        env:
          SERVER_URL: ${{ github.server_url }}
        run: |
          cd pkg
          PKG_DIR="packages/preview/${PACKAGE_NAME}/${VERSION}"
          mkdir -p "$PKG_DIR"
          curl -sSfL \
            "${SERVER_URL}/${GITHUB_REPOSITORY}/releases/download/${TAG}/${PACKAGE_NAME}-${VERSION}.tar.gz" \
            | tar xz -C "$PKG_DIR"
          git add "$PKG_DIR"
          git commit -m "${PACKAGE_NAME}:${VERSION}"

      - name: Push branch to fork
        if: steps.check.outputs.skip != 'true'
        run: |
          cd pkg
          git push --force origin "${PACKAGE_NAME}-${VERSION}"

      - name: Open PR upstream
        id: open
        if: steps.check.outputs.skip != 'true'
        run: |
          cd pkg
          new_pr_url=$(envsubst '${VERSION} ${TAG} ${GITHUB_REPOSITORY}' \
            < "$GITHUB_WORKSPACE/.github/typst-universe-pr-body.md" \
            | gh pr create \
                --repo "$UPSTREAM_REPO" \
                --base main \
                --head "${FORK_REPO%%/*}:${PACKAGE_NAME}-${VERSION}" \
                --title "${PACKAGE_NAME}:${VERSION}" \
                --body-file - \
            | tail -n 1)
          echo "Opened: $new_pr_url"
          echo "pr_url=$new_pr_url" >> "$GITHUB_OUTPUT"

      - name: Supersede earlier package PRs
        env:
          CURRENT_PR_URL: ${{ steps.check.outputs.pr_url || steps.open.outputs.pr_url }}
          SERVER_URL: ${{ github.server_url }}
        run: |
          stale=$(gh pr list \
            --repo "$UPSTREAM_REPO" \
            --author "@me" \
            --state open \
            --limit 100 \
            --json number,headRefName \
            | jq -r --arg cur "${PACKAGE_NAME}-${VERSION}" --arg prefix "${PACKAGE_NAME}-" \
                '.[] | select(.headRefName | startswith($prefix)) | select(.headRefName != $cur) | .number')
          if [ -z "$stale" ]; then
            echo "No older ${PACKAGE_NAME} submissions open — nothing to supersede."
            exit 0
          fi
          release_notes="${SERVER_URL}/${GITHUB_REPOSITORY}/releases/tag/${TAG}"
          body="Closing in favour of \`${PACKAGE_NAME}:${VERSION}\` at ${CURRENT_PR_URL}. The newer release supersedes this submission — see the [release notes](${release_notes}) for the cumulative changes."
          for pr in $stale; do
            if gh pr close "$pr" --repo "$UPSTREAM_REPO" --comment "$body"; then
              echo "Superseded PR #$pr"
            else
              echo "::warning::Could not close PR #$pr (already closed, or transient error) — continuing"
            fi
          done
