name: Bug report
description: Something gairm-import panics on, validates wrongly, or coerces unexpectedly
title: "fix: "
labels: ["bug"]
body:
  - type: input
    id: package-version
    attributes:
      label: gairm-import version
      description: The version in your `#import "@preview/gairm-import:…"` line.
      placeholder: "x.y.z"
    validations:
      required: true

  - type: input
    id: typst-version
    attributes:
      label: Typst version
      description: Output of `typst --version`.
      placeholder: "typst x.y.z"
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: The smallest `parse`, `validate`, `coerce` or `schema-from-json-schema` call, with its schema, that reproduces the issue. Inline it here; do not link an external gist.
      render: typst
    validations:
      required: true

  - type: textarea
    id: input-json
    attributes:
      label: Input JSON
      description: The document (or fragment) that triggers the bug, and the JSON Schema if you translate one. Trim secrets, keep enough to reproduce.
      render: json

  - type: textarea
    id: expected-vs-actual
    attributes:
      label: Expected vs. actual
      description: What did you expect gairm-import to return / accept / reject, and what did it do instead?
    validations:
      required: true

  - type: textarea
    id: additional
    attributes:
      label: Anything else
      description: OS, locale, downstream renderer, anything else that might matter.
