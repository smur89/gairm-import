name: Feature request
description: A JSON Schema keyword or format to support, a validation rule to change, or a new helper
title: "feat: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What can't you express or check today? Quote the JSON Schema keyword, JSON Resume field or call involved.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Sketch the API or behaviour you have in mind, with a small example schema and document.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Any workarounds you tried, or other shapes for the same idea.

  - type: checkboxes
    id: scope
    attributes:
      label: Scope
      description: gairm-import is a schema engine. Renderer-specific behaviour (theme, labels, decorations) belongs in the consuming template, and fields outside a schema in an extension schema the caller builds.
      options:
        - label: This request is about validation, coercion, translation, lenses or introspection, not rendering.
          required: true
